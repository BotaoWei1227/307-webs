<style>
  :root {
    --board: #17352f;
    --board-deep: #112a25;
    --panel: #1d423a;
    --chalk: #f3f1e7;
    --chalk-dim: #b9c6bd;
    --yellow: #f6d55c;
    --pink: #f4a6b8;
    --blue: #8ec9e8;
    --line: rgba(243, 241, 231, .16);
    --hand: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "BiauKai", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--chalk);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(255,255,255,.07), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(0,0,0,.25), transparent 60%),
      var(--board);
    line-height: 1.7;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 72px 24px 56px; }

  /* Hero */
  .hero { margin-bottom: 64px; }
  .hero h1 {
    font-family: var(--hand);
    font-weight: 700;
    font-size: clamp(64px, 14vw, 132px);
    line-height: 1;
    letter-spacing: .02em;
  }
  .hero h1 small {
    display: block;
    font-size: clamp(22px, 4.2vw, 34px);
    letter-spacing: .18em;
    margin-top: 14px;
    color: var(--yellow);
  }
  .chalk-line { display: block; width: min(420px, 80%); height: 18px; margin-top: 18px; overflow: visible; }
  .chalk-line path {
    fill: none; stroke: var(--chalk); stroke-width: 4; stroke-linecap: round; opacity: .85;
    stroke-dasharray: 460; stroke-dashoffset: 460;
    animation: draw 1.1s .2s cubic-bezier(.6,.1,.2,1) forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .hero p { margin-top: 22px; max-width: 30em; color: var(--chalk-dim); font-size: 17px; }

  /* Sections */
  section + section { margin-top: 56px; }
  .sec-title {
    display: flex; align-items: baseline; gap: 14px;
    font-family: var(--hand); font-weight: 700; font-size: 30px;
    margin-bottom: 20px; padding-bottom: 12px;
    border-bottom: 2px dashed var(--line);
  }
  .sec-title span { font-family: var(--sans); font-weight: 400; font-size: 14px; color: var(--chalk-dim); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 22px; }
  @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; gap: 26px; } }

  /* Card */
  .card {
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 12px 18px;
    color: inherit; text-decoration: none;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent, var(--yellow)); box-shadow: 0 14px 30px rgba(0,0,0,.28); }
  .card:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

  .thumb {
    position: relative; aspect-ratio: 16 / 10; overflow: hidden;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
  }
  .thumb::before {   /* 粉筆方格 */
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.10) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .thumb svg, .thumb img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transition: transform .6s ease;
  }
  .thumb img { object-fit: cover; object-position: top; }
  .thumb svg text { font-family: var(--hand); font-weight: 700; }
  .card:hover .thumb svg, .card:hover .thumb img { transform: scale(1.03); }

  .info { padding: 16px 8px 0; display: flex; flex-direction: column; gap: 4px; }
  .name { font-family: var(--hand); font-weight: 700; font-size: 25px; line-height: 1.3; }
  .dev { font-size: 14px; color: var(--chalk-dim); }
  .dev b { font-weight: 500; color: var(--chalk); }
  .go {
    margin-top: 12px; align-self: flex-start;
    font-size: 14px; font-weight: 500; color: var(--board-deep);
    background: var(--accent, var(--yellow));
    padding: 4px 16px; border-radius: 999px;
  }

  footer { margin-top: 72px; font-size: 13px; color: var(--chalk-dim); border-top: 2px dashed var(--line); padding-top: 18px; }

  @media (prefers-reduced-motion: reduce) {
    .chalk-line path { animation: none; stroke-dashoffset: 0; }
    .card, .thumb svg, .thumb img { transition: none; }
    .card:hover { transform: none; }
    .card:hover .thumb svg, .card:hover .thumb img { transform: none; }
  }
</style>
</head>
<body>

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
